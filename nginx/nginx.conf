events {
    worker_connections 1024;
}

http {
    # Map WebSocket upgrade headers
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Determine the real client IP (prefer X-Forwarded-For if sitting behind a CDN/LB)
    map $http_x_forwarded_for $client_real_ip {
        ""      $remote_addr;
        default $http_x_forwarded_for;
    }

    upstream queuedesk_api {
        # Hash based on the real client IP so CDNs don't bundle everyone onto one server
        hash $client_real_ip consistent;
        
        server host.docker.internal:3001;
        server host.docker.internal:3002;
        server host.docker.internal:3003;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://queuedesk_api;
            
            # Forward real IP headers
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;

            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
